<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛒 奶蛙购 · 官方周边商城</title>
<link rel="icon" href="naiwa.webp">
<meta name="description" content="奶蛙购：奶蛙宇宙官方周边商城，限时秒杀、优惠券、购物车、下单全流程。">
<style>
  :root{
    --bg:#05071a; --panel:rgba(16,22,48,.72); --ink:#e8ecff; --muted:#8b93c8;
    --frog1:#ffd94d; --cyan:#22d3ee; --accent:#ff6ec7; --green:#7ec850; --line:#2a3a6a;
    --red:#ff4d4f; --card:#0d1330;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh}
  canvas#netbg{position:fixed;inset:0;z-index:0;opacity:.35;pointer-events:none}
  a{color:inherit}

  /* ============ 顶部搜索栏（淘宝式） ============ */
  .topbar{position:relative;z-index:60;background:linear-gradient(90deg,#0a0f2e,#131a44,#0a0f2e);
    border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:900;letter-spacing:1px}
  .logo img{width:38px;height:38px;object-fit:contain;border-radius:50%;border:2px solid var(--frog1);
    box-shadow:0 0 16px rgba(255,217,77,.5);animation:hop 2.4s ease-in-out infinite}
  @keyframes hop{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
  .logo span{background:linear-gradient(90deg,#ffd94d,#ff6ec7,#22d3ee);background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 5s linear infinite}
  @keyframes flow{0%{background-position:0 0}100%{background-position:250% 0}}
  .search{flex:1;min-width:240px;display:flex;max-width:640px;position:relative}
  .search input{flex:1;background:rgba(5,7,26,.9);border:2px solid var(--frog1);border-right:none;
    border-radius:24px 0 0 24px;padding:11px 18px;color:var(--ink);font-size:13.5px;font-family:inherit;outline:none}
  .search input:focus{box-shadow:0 0 20px rgba(255,217,77,.4)}
  .search button{border:2px solid var(--frog1);background:linear-gradient(135deg,#ffd94d,#f5a800);color:#05071a;
    font-weight:900;font-size:13.5px;padding:0 26px;border-radius:0 24px 24px 0;cursor:pointer;font-family:inherit}
  .search button:hover{filter:brightness(1.1)}
  .hotwords{position:absolute;top:48px;left:18px;display:flex;gap:10px;font-size:11px;color:var(--muted);flex-wrap:wrap;z-index:5}
  .hotwords b{cursor:pointer;font-weight:400}
  .hotwords b:hover{color:var(--frog1)}
  .topacts{display:flex;align-items:center;gap:8px;margin-left:auto}
  .tbtn{background:rgba(16,22,48,.8);border:1px solid var(--line);color:var(--ink);border-radius:20px;
    padding:8px 15px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:all .22s;position:relative;white-space:nowrap}
  .tbtn:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 14px rgba(34,211,238,.25)}
  .tbtn .dot{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:10px;font-weight:800;
    min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}

  nav{position:sticky;top:0;z-index:55;background:rgba(5,7,26,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  nav .inner{max-width:1320px;margin:0 auto;display:flex;gap:6px;padding:8px 16px;overflow-x:auto;scrollbar-width:none}
  nav a{text-decoration:none;color:var(--ink);font-size:12.5px;padding:6px 14px;border-radius:20px;white-space:nowrap;transition:all .25s;border:1px solid transparent}
  nav a:hover{color:var(--cyan);border-color:rgba(34,211,238,.5);box-shadow:0 0 14px rgba(34,211,238,.25)}

  .wrap{position:relative;z-index:2;max-width:1320px;margin:0 auto;padding:16px 18px 90px}

  /* ============ 秒杀横幅 ============ */
  .flash{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-radius:20px;padding:16px 22px;margin-bottom:16px;
    background:linear-gradient(120deg,rgba(255,77,79,.2),rgba(255,217,77,.14),rgba(255,110,199,.16));
    border:1px solid rgba(255,77,79,.45);position:relative;overflow:hidden}
  .flash::after{content:"";position:absolute;top:0;left:-60%;width:50%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);animation:sheen 3.2s infinite}
  @keyframes sheen{0%{left:-60%}100%{left:130%}}
  .flash img{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 0 14px rgba(255,217,77,.6))}
  .flash .t1{font-size:19px;font-weight:900;color:#fff}
  .flash .t2{font-size:12px;color:var(--muted);margin-top:4px}
  .flash .cd{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
  .flash .cd b{background:#05071a;border:1px solid var(--red);color:var(--red);font-family:Consolas,monospace;
    font-size:19px;padding:5px 10px;border-radius:9px;font-weight:900;box-shadow:0 0 14px rgba(255,77,79,.4)}
  .flash .cd i{font-style:normal;color:var(--red);font-weight:900}

  /* ============ 优惠券条 ============ */
  .coupons{display:flex;gap:10px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
  .cp{flex-shrink:0;border:1px dashed var(--frog1);border-radius:12px;padding:8px 16px;background:rgba(255,217,77,.06);
    cursor:pointer;transition:all .2s;text-align:center;min-width:118px}
  .cp:hover{background:rgba(255,217,77,.16);transform:translateY(-2px)}
  .cp.got{opacity:.5;cursor:default;border-color:var(--line)}
  .cp b{display:block;font-size:16px;color:var(--frog1)}
  .cp span{font-size:10.5px;color:var(--muted)}

  /* ============ 主体布局 ============ */
  .layout{display:grid;grid-template-columns:196px 1fr;gap:16px;align-items:start}
  @media(max-width:900px){.layout{grid-template-columns:1fr}}
  .side{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;position:sticky;top:64px}
  @media(max-width:900px){.side{position:static}}
  .side h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:7px}
  .side h3 span{font-size:10.5px;font-weight:400;color:var(--muted)}
  .cat{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
  .cat button{text-align:left;background:none;border:1px solid transparent;color:var(--muted);font-size:12.5px;
    padding:8px 11px;border-radius:10px;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;justify-content:space-between}
  .cat button:hover{background:rgba(34,211,238,.08);color:var(--ink)}
  .cat button.on{background:linear-gradient(135deg,rgba(255,217,77,.2),rgba(255,110,199,.12));
    color:var(--frog1);font-weight:800;border-color:rgba(255,217,77,.4)}
  .cat button i{font-style:normal;font-size:10.5px;opacity:.7}
  .pricebox{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:16px}
  .pricebox input{width:100%;background:rgba(5,7,26,.8);border:1px solid var(--line);border-radius:8px;
    padding:7px 9px;color:var(--ink);font-size:12px;font-family:inherit;outline:none}
  .pricebox input:focus{border-color:var(--frog1)}
  .side .apply{width:100%;background:rgba(34,211,238,.16);border:1px solid rgba(34,211,238,.5);color:var(--cyan);
    border-radius:9px;padding:8px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .side .apply:hover{background:rgba(34,211,238,.28)}

  .main{min-width:0}
  .sortbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:9px 13px;margin-bottom:14px;font-size:12.5px}
  .sortbar button{background:none;border:1px solid transparent;color:var(--muted);padding:5px 12px;border-radius:9px;
    cursor:pointer;font-family:inherit;font-size:12.5px;transition:all .2s}
  .sortbar button:hover{color:var(--ink);background:rgba(255,255,255,.05)}
  .sortbar button.on{color:var(--frog1);border-color:rgba(255,217,77,.5);background:rgba(255,217,77,.1);font-weight:800}
  .sortbar .cnt{margin-left:auto;color:var(--muted);font-size:11.5px}
  .sortbar .cnt b{color:var(--frog1)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;
    transition:all .28s;cursor:pointer;display:flex;flex-direction:column}
  .card:hover{transform:translateY(-6px);border-color:rgba(34,211,238,.5);box-shadow:0 14px 40px rgba(34,211,238,.18)}
  .card .imgwrap{height:172px;display:flex;align-items:center;justify-content:center;position:relative;
    background:radial-gradient(circle at 50% 62%, rgba(255,217,77,.1), transparent 70%)}
  .card .imgwrap img,.card .imgwrap canvas{max-width:78%;max-height:150px;object-fit:contain;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.55));transition:transform .32s cubic-bezier(.2,1.2,.4,1)}
  .card:hover .imgwrap img,.card:hover .imgwrap canvas{transform:scale(1.12) rotate(-4deg)}
  .card .flag{position:absolute;top:9px;left:9px;font-size:10px;font-weight:800;padding:3px 9px;border-radius:8px;
    background:var(--red);color:#fff;box-shadow:0 0 12px rgba(255,77,79,.6)}
  .card .flag.new{background:var(--green);box-shadow:0 0 12px rgba(126,200,80,.6)}
  .card .flag.hot{background:linear-gradient(135deg,#ff6ec7,#ffd94d);color:#05071a}
  .card .off{position:absolute;top:9px;right:9px;font-size:10px;font-weight:800;color:var(--frog1);
    background:rgba(5,7,26,.8);border:1px solid rgba(255,217,77,.5);border-radius:8px;padding:2px 7px}
  .card .body{padding:11px 12px 13px;display:flex;flex-direction:column;flex:1}
  .card h4{font-size:13.5px;line-height:1.45;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card h4 em{font-style:normal;background:rgba(255,77,79,.18);color:#ff9a9a;font-size:10px;border-radius:5px;padding:0 5px;margin-right:5px}
  .card .tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px;min-height:17px}
  .card .tags span{font-size:9.5px;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:1px 6px}
  .card .rating{font-size:10.5px;color:var(--muted);margin-bottom:7px}
  .card .rating b{color:var(--frog1)}
  .card .prow{display:flex;align-items:baseline;gap:7px;margin-top:auto}
  .card .price{font-size:20px;font-weight:900;color:var(--red);font-family:Consolas,monospace}
  .card .price i{font-size:12px;font-style:normal}
  .card .old{font-size:11px;color:var(--muted);text-decoration:line-through}
  .card .sold{margin-left:auto;font-size:10.5px;color:var(--muted)}
  .card .stockbar{height:5px;border-radius:3px;background:rgba(42,58,106,.6);overflow:hidden;margin-top:8px}
  .card .stockbar i{display:block;height:100%;background:linear-gradient(90deg,#ff4d4f,#ffd94d)}
  .card .stocktxt{font-size:10px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between}
  .card .act{display:flex;gap:7px;margin-top:10px}
  .card .act button{flex:1;border:none;border-radius:10px;padding:9px;font-size:12.5px;font-weight:800;cursor:pointer;
    font-family:inherit;transition:all .22s}
  .card .buy{background:linear-gradient(135deg,#ff4d4f,#ff8a3c);color:#fff}
  .card .buy:hover{box-shadow:0 0 18px rgba(255,77,79,.6)}
  .card .add{background:linear-gradient(135deg,#ffd94d,#f5a800);color:#05071a}
  .card .add:hover{box-shadow:0 0 18px rgba(255,217,77,.6)}
  .card .add.done{background:var(--green);color:#05071a}

  .empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:13.5px;grid-column:1/-1}
  .empty b{display:block;font-size:42px;margin-bottom:12px}

  /* ============ 详情弹层 ============ */
  .modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:18px}
  .modal.open{display:flex}
  .modal .mask{position:absolute;inset:0;background:rgba(2,4,14,.78);backdrop-filter:blur(5px)}
  .modal .box{position:relative;background:#0b1030;border:1px solid var(--line);border-radius:20px;
    width:min(860px,96vw);max-height:88vh;overflow-y:auto;box-shadow:0 30px 90px rgba(0,0,0,.7);
    animation:pop .3s cubic-bezier(.2,1.2,.4,1) both}
  @keyframes pop{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:none}}
  .modal .close{position:absolute;top:12px;right:14px;background:rgba(5,7,26,.8);border:1px solid var(--line);
    color:var(--muted);width:34px;height:34px;border-radius:50%;font-size:19px;cursor:pointer;z-index:3}
  .modal .close:hover{color:var(--red);border-color:var(--red)}
  .dt{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:20px;padding:22px}
  @media(max-width:700px){.dt{grid-template-columns:1fr}}
  .dt .big{background:radial-gradient(circle at 50% 60%, rgba(255,217,77,.13), transparent 72%);border-radius:16px;
    display:flex;align-items:center;justify-content:center;min-height:250px;border:1px solid var(--line);position:relative;overflow:hidden}
  .dt .big img,.dt .big canvas{max-width:82%;max-height:230px;object-fit:contain;filter:drop-shadow(0 16px 26px rgba(0,0,0,.6))}
  .dt .big .zoombadge{position:absolute;bottom:9px;right:11px;font-size:10px;color:var(--muted)}
  .dt h2{font-size:19px;line-height:1.45;margin-bottom:9px}
  .dt h2 em{font-style:normal;background:var(--red);color:#fff;font-size:11px;border-radius:6px;padding:2px 7px;margin-right:7px;vertical-align:2px}
  .dt .sub{font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:13px}
  .pbox{background:linear-gradient(120deg,rgba(255,77,79,.14),rgba(255,217,77,.08));border:1px solid rgba(255,77,79,.3);
    border-radius:13px;padding:13px 16px;margin-bottom:14px}
  .pbox .now{font-size:31px;font-weight:900;color:var(--red);font-family:Consolas,monospace}
  .pbox .now i{font-size:15px;font-style:normal}
  .pbox .old{font-size:12px;color:var(--muted);text-decoration:line-through;margin-left:9px}
  .pbox .save{font-size:11.5px;color:var(--green);margin-left:9px}
  .pbox .row2{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
  .spec{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px;margin-bottom:14px}
  .spec .k{color:var(--muted)} .spec .v{color:var(--ink)}
  .qtyrow{display:flex;align-items:center;gap:11px;margin-bottom:15px;font-size:12.5px;color:var(--muted)}
  .qtyrow .q{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .qtyrow .q button{width:33px;height:33px;background:rgba(16,22,48,.7);border:none;color:var(--ink);font-size:16px;cursor:pointer}
  .qtyrow .q button:hover{background:rgba(34,211,238,.2)}
  .qtyrow .q b{width:46px;text-align:center;font-size:14px}
  .dt .buys{display:flex;gap:9px;flex-wrap:wrap}
  .dt .buys button{border:none;border-radius:12px;padding:13px 30px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .22s}
  .dt .buys .b1{background:linear-gradient(135deg,#ffd94d,#f5a800);color:#05071a}
  .dt .buys .b2{background:linear-gradient(135deg,#ff4d4f,#ff8a3c);color:#fff;box-shadow:0 0 22px rgba(255,77,79,.45)}
  .dt .buys button:hover{transform:translateY(-2px);filter:brightness(1.08)}
  .reviews{border-top:1px dashed var(--line);padding:18px 22px 24px}
  .reviews h3{font-size:14px;margin-bottom:12px;display:flex;gap:9px;align-items:center}
  .reviews h3 span{font-size:11px;color:var(--muted);font-weight:400}
  .rv{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid rgba(42,58,106,.4);font-size:12.5px}
  .rv .av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:17px;background:rgba(34,211,238,.14);border:1px solid var(--line)}
  .rv .rc{flex:1}
  .rv .rn{color:var(--muted);font-size:11px;margin-bottom:3px}
  .rv .rn b{color:var(--frog1)}
  .rv .stars{color:var(--frog1);font-size:11px;letter-spacing:1px}

  /* ============ 购物车抽屉 ============ */
  .drawer{position:fixed;right:0;top:0;bottom:0;width:min(400px,93vw);z-index:210;background:#0a0f2b;
    border-left:1px solid var(--line);transform:translateX(102%);transition:transform .36s cubic-bezier(.2,.85,.3,1);
    display:flex;flex-direction:column;box-shadow:-24px 0 70px rgba(0,0,0,.6)}
  .drawer.open{transform:none}
  .drawer .dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .drawer .dh h3{font-size:16px}
  .drawer .dh button{background:none;border:none;color:var(--muted);font-size:23px;cursor:pointer}
  .drawer .dh button:hover{color:var(--red)}
  .drawer .dbody{flex:1;overflow-y:auto;padding:14px}
  .ci{display:flex;gap:11px;background:rgba(16,22,48,.66);border:1px solid var(--line);border-radius:13px;padding:10px;margin-bottom:10px}
  .ci .pimg{width:56px;height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:rgba(5,7,26,.7);border-radius:9px}
  .ci .pimg img,.ci .pimg canvas{max-width:48px;max-height:48px;object-fit:contain}
  .ci .info{flex:1;min-width:0}
  .ci .info h5{font-size:12.5px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ci .info .pp{font-size:14px;font-weight:800;color:var(--red);font-family:Consolas,monospace}
  .ci .qty{display:flex;align-items:center;gap:7px;margin-top:6px}
  .ci .qty button{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;font-size:13px}
  .ci .qty button:hover{border-color:var(--cyan);color:var(--cyan)}
  .ci .qty b{font-size:12.5px;min-width:20px;text-align:center}
  .ci .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;align-self:flex-start}
  .ci .del:hover{color:var(--red)}
  .drawer .dfoot{padding:14px 18px;border-top:1px solid var(--line);background:rgba(5,7,26,.7)}
  .sumrow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .sumrow.total{font-size:15px;color:var(--ink);font-weight:800;margin:9px 0 12px}
  .sumrow.total span:last-child{color:var(--red);font-size:24px;font-family:Consolas,monospace}
  .sumrow.save span:last-child{color:var(--green)}
  .ckbtn{width:100%;border:none;border-radius:13px;padding:14px;font-size:15px;font-weight:900;cursor:pointer;
    background:linear-gradient(135deg,#ff4d4f,#ff8a3c);color:#fff;font-family:inherit;box-shadow:0 0 22px rgba(255,77,79,.4)}
  .ckbtn:hover{filter:brightness(1.08)}
  .ckbtn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

  /* ============ 结算弹层 ============ */
  .steps{display:flex;gap:6px;align-items:center;justify-content:center;padding:16px 20px 0;font-size:11.5px;color:var(--muted)}
  .steps .s{display:flex;align-items:center;gap:6px}
  .steps .s i{width:21px;height:21px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;
    justify-content:center;font-style:normal;font-size:11px}
  .steps .s.on{color:var(--frog1)} .steps .s.on i{border-color:var(--frog1);background:rgba(255,217,77,.16);font-weight:800}
  .steps .s.done i{border-color:var(--green);color:var(--green)}
  .steps .ln{width:36px;height:1px;background:var(--line)}
  .ckbody{padding:20px 22px 24px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;background:rgba(5,7,26,.85);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;color:var(--ink);font-size:13px;font-family:inherit;outline:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--frog1)}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}

function bestCoupon(total) {

/* ---------------- 商品展示 ---------------- */
var spriteCache = {};
function productSprite(p) {
  if (spriteCache[p.id]) return spriteCache[p.id];
  var cv = document.createElement("canvas");
  cv.width = 220; cv.height = 220;
  var c = cv.getContext("2d");
  var src = p.src || "naiwa-standing.webp";
  var sp = NAIWA.tintSprite(src, p.tint || "#ffd94d", { alpha: .55, size: 220 });
  c.drawImage(sp, 0, 0, 220, 220);
  /* 数字/食品类商品叠一个 emoji 标 */
  if (p.c === "digital" || p.c === "food" || p.c === "sticker") {
    c.font = "58px serif"; c.textAlign = "center"; c.textBaseline = "middle";
    c.globalAlpha = .95;
    c.fillText(p.emoji, 110, 190);
  }
  spriteCache[p.id] = cv;
  return cv;
}
function productImgHTML(p, size) {
  var cv = productSprite(p);
  return '<img src="' + cv.toDataURL("image/png") + '" alt="' + p.name + '" loading="lazy">';
}

function discount(p) {
  if (!p.old || p.old <= p.price) return 0;
  return Math.round((1 - p.price / p.old) * 100);
}

function filtered() {
  var list = PRODUCTS.filter(function (p) {
    if (st.cat !== "all" && p.c !== st.cat) return false;
    if (st.pmin !== null && p.price < st.pmin) return false;
    if (st.pmax !== null && p.price > st.pmax) return false;
    if (st.q) {
      var t = (p.name + p.desc + p.tags.join(" ") + p.emoji + p.c).toLowerCase();
      if (t.indexOf(st.q.toLowerCase()) < 0) return false;
    }
    return true;
  });
  var s = st.sort;
  list.sort(function (a, b) {
    if (s === "sales") return b.sold - a.sold;
    if (s === "priceUp") return a.price - b.price;
    if (s === "priceDown") return b.price - a.price;
    if (s === "rating") return b.rating - a.rating;
    if (s === "discount") return discount(b) - discount(a);
    return b.sold * b.rating - a.sold * a.rating;
  });
  return list;
}

/* ---------------- 购物车 ---------------- */
function cartKey(id, sku) { return id + "::" + (sku || 0); }
function parseKey(k) { var a = k.split("::"); return { id: +a[0], sku: +a[1] }; }
function cartEntries() {
  return Object.keys(st.cart).map(function (k) {
    var pk = parseKey(k), p = PRODUCTS.filter(function (x) { return x.id === pk.id; })[0];
    if (!p || st.cart[k] <= 0) return null;
    var sp = p.skus ? (p.skus[pk.sku] || p.skus[0]).p : 0;
    return { key: k, p: p, sku: pk.sku, qty: st.cart[k], unit: p.price + sp, skuName: p.skus ? (p.skus[pk.sku] || p.skus[0]).n : "" };
  }).filter(Boolean);
}
function cartCount() { var n = 0; for (var k in st.cart) n += st.cart[k]; return n; }
function cartTotal() { return cartEntries().reduce(function (s, e) { return s + e.unit * e.qty; }, 0); }

function addToCart(id, sku, qty, btn) {
  var key = cartKey(id, sku || 0);
  st.cart[key] = (st.cart[key] || 0) + (qty || 1);
  NAIWA.store.set("shop:cart", st.cart);
  NAIWA.audio.coin();
  if (btn) {
    btn.classList.add("done"); var old = btn.textContent; btn.textContent = "✓ 已加购";
    setTimeout(function () { btn.classList.remove("done"); btn.textContent = old; }, 900);
  }
  toast("🛒 已加入购物车！", "#7ec850");
  syncCart();
}
function setQty(key, delta) {
  st.cart[key] = (st.cart[key] || 0) + delta;
  if (st.cart[key] <= 0) delete st.cart[key];
  NAIWA.store.set("shop:cart", st.cart);
  syncCart();
}
function removeItem(key) {
  delete st.cart[key];
  NAIWA.store.set("shop:cart", st.cart);
  syncCart(); toast("已移出购物车", "#8b93c8");
}

function syncCart() {
  var n = cartCount();
  $("cartCount").textContent = n;
  $("cartCount").style.display = n ? "flex" : "none";
  $("cartTip").textContent = n ? "共 " + n + " 件" : "";
  var entries = cartEntries();
  if (!entries.length) {
    $("cartItems").innerHTML = '<div class="empty" style="padding:50px 10px"><b>🐸</b>购物车空空如也<br>奶蛙正在看着你……</div>';
  } else {
    $("cartItems").innerHTML = entries.map(function (e) {
      return '<div class="ci">' +
        '<div class="pimg">' + productImgHTML(e.p) + '</div>' +
        '<div class="info"><h5>' + e.p.name + (e.skuName ? " · " + e.skuName : "") + '</h5>' +
          '<div class="pp">¥' + e.unit.toFixed(2) + '</div>' +
          '<div class="qty"><button data-minus="' + e.key + '">−</button><b>' + e.qty + '</b>' +
          '<button data-plus="' + e.key + '">+</button>' +
          '<span style="color:var(--muted);font-size:11px;margin-left:6px">小计 ¥' + (e.unit * e.qty).toFixed(2) + '</span></div>' +
        '</div>' +
        '<button class="del" data-del="' + e.key + '">🗑️</button>' +
      '</div>';
    }).join("");
    NAIWA.$$("#cartItems [data-minus]").forEach(function (b) { b.onclick = function () { setQty(b.dataset.minus, -1); }; });
    NAIWA.$$("#cartItems [data-plus]").forEach(function (b) { b.onclick = function () { setQty(b.dataset.plus, 1); }; });
    NAIWA.$$("#cartItems [data-del]").forEach(function (b) { b.onclick = function () { removeItem(b.dataset.del); }; });
  }
  var total = cartTotal();
  var cp = bestCoupon(total);
  var cut = cp ? cp.v : 0;
  $("sumGoods").textContent = "¥" + total.toFixed(2);
  $("sumCoupon").textContent = "-¥" + cut.toFixed(2) + (cp ? "（" + cp.name + "）" : "");
  $("sumShip").textContent = total >= 59 || total === 0 ? "包邮" : "¥8.00";
  var ship = (total >= 59 || total === 0) ? 0 : 8;
  $("sumTotal").textContent = "¥" + Math.max(0, total - cut + ship).toFixed(2);
  $("toCheckout").disabled = !entries.length;
  st.activeCoupon = cp;
}

        var order = {
          no: "NW" + Date.now().toString().slice(-10) + Math.floor(Math.random() * 90 + 10),
          time: new Date().toLocaleString("zh-CN"),
          items: entries.map(function (e) { return { name: e.p.name, sku: e.skuName, qty: e.qty, unit: e.unit }; }),
          pay: Math.max(0, total - cut2 + ship2),
          method: ck.pay, addr: ck.addr,
          status: "已支付 · 待发货"
        };
        st.orders.unshift(order);
        st.orders = st.orders.slice(0, 20);
        NAIWA.store.set("shop:orders", st.orders);
        st.cart = {}; NAIWA.store.set("shop:cart", {});
        syncCart();
        NAIWA.audio.coin();
        ck.step = 3; renderCheckout();
      }, 1700);
    });
  } else {
    if ($("ckOrders")) $("ckOrders").addEventListener("click", function () { closeModal("checkout"); openOrders(); });
    if ($("ckClose")) $("ckClose").addEventListener("click", function () { closeModal("checkout"); });
  }
}

/* ---------------- 我的订单 ---------------- */
function openOrders() {
  var o = st.orders;
  $("ordBox").innerHTML = '<button class="close" data-close="orders">×</button>' +
    '<div class="ckbody"><h2 style="font-size:18px;margin-bottom:14px">📦 我的订单 <span style="font-size:11.5px;color:var(--muted);font-weight:400">（保存在本机浏览器）</span></h2>' +
    (o.length ? o.map(function (x) {
      return '<div class="ordercard">' +
        '<div class="oh"><span>订单号 <b>' + x.no + '</b></span><span>' + x.time + '</span></div>' +
        '<div class="ob">' + x.items.map(function (i) { return "🐸 " + i.name + (i.sku ? " · " + i.sku : "") + " ×" + i.qty; }).join("<br>") + "</div>" +
        '<div class="oh" style="margin-top:9px;margin-bottom:0"><span class="st">✅ ' + x.status + '</span><span>实付 <b style="color:var(--red)">¥' + x.pay.toFixed(2) + '</b> · ' + x.method + '</span></div>' +
        '</div>';
    }).join("") : '<div class="empty" style="padding:40px 10px"><b>📭</b>还没有订单<br>去挑一件奶蛙周边吧</div>') +
    "</div>";
  openModal("orders");
}

/* ---------------- 弹层控制 ---------------- */
function openModal(id) { $(id).classList.add("open"); }
function closeModal(id) { $(id).classList.remove("open"); }
document.addEventListener("click", function (e) {
  var c = e.target.closest("[data-close]");
  if (!c) return;
  var v = c.dataset.close;
  if (v === "cart") { $("cartDrawer").classList.remove("open"); return; }
  if (v === "1") {
    var m = e.target.closest(".modal");
    if (m) closeModal(m.id);
    return;
  }
  closeModal(v);
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    ["detail", "checkout", "orders"].forEach(function (id) { closeModal(id); });
    $("cartDrawer").classList.remove("open");
  }
});

/* ---------------- 提示 ---------------- */
var toastEl = $("toast");
function toast(msg, color, isErr) {
  toastEl.textContent = msg;
  toastEl.style.borderColor = color || "#7ec850";
  toastEl.style.color = color || "#7ec850";
  toastEl.classList.add("show");
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(function () { toastEl.classList.remove("show"); }, 1900);
}

/* ---------------- 顶部交互 ---------------- */
$("searchBtn").addEventListener("click", doSearch);
$("q").addEventListener("keydown", function (e) { if (e.key === "Enter") doSearch(); });
$("q").addEventListener("input", function () {
  if (this.value === "") { st.q = ""; renderGrid(); }
});
function doSearch() {
  st.q = $("q").value.trim();
  st.cat = "all"; st.pmin = st.pmax = null;
  $("pmin").value = ""; $("pmax").value = "";
  renderCats(); renderGrid();
  NAIWA.audio.select();
  if (st.q) toast("🔍 搜索「" + st.q + "」共 " + filtered().length + " 件", "#22d3ee");
}
NAIWA.$$(".hotwords b").forEach(function (b) {
  b.addEventListener("click", function () { $("q").value = b.dataset.w; doSearch(); });
});
NAIWA.$$(".sortbar button").forEach(function (b) {
  b.addEventListener("click", function () {
    NAIWA.$$(".sortbar button").forEach(function (x) { x.classList.remove("on"); });
    b.classList.add("on"); st.sort = b.dataset.s; NAIWA.audio.select(); renderGrid();
  });
});
$("applyPrice").addEventListener("click", function () {
  var a = parseFloat($("pmin").value), b2 = parseFloat($("pmax").value);
  st.pmin = isNaN(a) ? null : a;
  st.pmax = isNaN(b2) ? null : b2;
  if (st.pmin !== null && st.pmax !== null && st.pmin > st.pmax) { var t = st.pmin; st.pmin = st.pmax; st.pmax = t; }
  renderGrid(); toast("已应用价格筛选 · " + filtered().length + " 件", "#22d3ee");
});
$("cartFab").addEventListener("click", function () { $("cartDrawer").classList.add("open"); syncCart(); });
$("toCheckout").addEventListener("click", openCheckout);
$("myOrders").addEventListener("click", openOrders);
$("backtop").addEventListener("click", function () { scrollTo({ top: 0, behavior: "smooth" }); });
addEventListener("scroll", function () {
  $("backtop").classList.toggle("show", scrollY > 600);
});

/* ---------------- 秒杀倒计时 ---------------- */
setInterval(function () {
  st.flashLeft--;
  if (st.flashLeft <= 0) st.flashLeft = 4 * 3600;
  var h = Math.floor(st.flashLeft / 3600), m = Math.floor(st.flashLeft % 3600 / 60), s = st.flashLeft % 60;
  $("cdH").textContent = String(h).padStart(2, "0");
  $("cdM").textContent = String(m).padStart(2, "0");
  $("cdS").textContent = String(s).padStart(2, "0");
}, 1000);

/* ---------------- 启动 ---------------- */
/* 先预热奶蛙原图，保证所有商品图都是真实换色精灵而不是占位图 */
NAIWA.preloadFrogs().catch(function () { }).then(function () {
  renderCoupons();
  renderCats();
  renderGrid();
  syncCart();
  NAIWA.toast("🛒 奶蛙购已就绪 · 领券再买更便宜", "#ffd94d");
});

})();
</script>
</body>
</html>
